name: Flys
version: ${version}
website: https://pixelplayz.net
main: de.doetchen.projects.Flys
api-version: '1.21'
load: STARTUP
authors: [ Doetchen ]
description: Fly's is yet another, but EXTREMELY Sexy fly plugin for Minecraft.
softdepend: [PlaceholderAPI]
commands:
  fly:
    description: Toggle flight mode for yourself or other players, optionally for a limited time
    usage: /<command> [player] [time]
  flys:
    description: Manage world restrictions for flight
    usage: /<command> addworld <world> <allowed|disallowed> or /<command> removeworld <world> or /<command> listworlds
  flyspeed:
    description: Set flight speed from 1-10
    usage: /<command> [1-10] or /<command> [player] [1-10]
  flyreload:
    description: Reload the plugin configuration
    usage: /<command>
permissions:
  flys.fly:
    description: Allows you to toggle flight mode
    default: op
  flys.fly.others:
    description: Allows you to toggle flight mode for other players
    default: op
  flys.admin:
    description: Allows you to manage world restrictions
    default: op
  flys.flyspeed:
    description: Allows you to change flight speed
    default: op
  flys.flyspeed.others:
    description: Allows you to change flight speed for other players
    default: op
  flys.flyreload:
    description: Allows you to reload the plugin configuration
    default: op
  flys.updatenotify:
    description: Allows you to receive update notifications on join
    default: op
  flys.fly.temp:
    description: Allows you to give timed flight with /fly <player> <time>
    default: op
  flys.bypass.combat:
    description: Never gets flight blocked by the combat cooldown
    default: op
  flys.maxspeed.1:
    description: Limits the maximum flight speed to 1
    default: false
  flys.maxspeed.2:
    description: Limits the maximum flight speed to 2
    default: false
  flys.maxspeed.3:
    description: Limits the maximum flight speed to 3
    default: false
  flys.maxspeed.4:
    description: Limits the maximum flight speed to 4
    default: false
  flys.maxspeed.5:
    description: Limits the maximum flight speed to 5
    default: false
  flys.maxspeed.6:
    description: Limits the maximum flight speed to 6
    default: false
  flys.maxspeed.7:
    description: Limits the maximum flight speed to 7
    default: false
  flys.maxspeed.8:
    description: Limits the maximum flight speed to 8
    default: false
  flys.maxspeed.9:
    description: Limits the maximum flight speed to 9
    default: false
  flys.maxspeed.10:
    description: Limits the maximum flight speed to 10
    default: false
