# !Make sure you don't forget any characters (Like ", : or ,)! Otherwise, the config will break! (config and messages)

# Message settings
messages:
  prefix: "&8[&b&lFlys&8] "

# Language settings (en = English, de = German, es = Spanish, fr = French, ru = Russian, pl = Polish)
language:
  language: "en"

update-checker:
  enabled: true

# Permissions (customizable)
permissions:
  fly: "flys.fly"
  fly-others: "flys.fly.others"
  admin: "flys.admin"
  flyspeed: "flys.flyspeed"
  flyspeed-others: "flys.flyspeed.others"
  flyreload: "flys.flyreload"
  fly-temp: "flys.fly.temp"
  bypass-combat: "flys.bypass.combat"
  flyspeed-limit: "flys.maxspeed"

# General settings
general:
  enable-particles: true
  enable-sounds: true
  flight-speed:
    default-speed: 0.1
    max-speed: 1.0

# World settings
worlds:
  # List of worlds where flying is allowed (empty = all worlds)
  # Example: ["world", "world_nether", "creative"]
  allowed-worlds: []
  # List of worlds where flying is disabled
  # Example: ["pvp_world", "hardcore", "minigames"]
  disabled-worlds: []

# Extra features
extras:
  # No fall damage after flight is switched off in mid-air
  fall-protection: false
  # Gives players their flight back when they rejoin
  restore-flight-on-join: false
  # Longest time for /fly <player> <time> in seconds (default: 7 days)
  timed-flight-max-seconds: 604800
  # Disables flight after PvP damage and blocks it until the cooldown has passed
  combat:
    disable-flight: false
    cooldown-seconds: 10
